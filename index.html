 <!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Instagram Clone</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">

    <!-- BARRA IZQUIERDA -->
    <div class="sidebar">
        <div class="logo"><img src="img/logo.png" width="100"></div>

        <div class="item"><img src="img/casa.png"><span>Inicio</span></div>
        <div class="item"><img src="img/lupa.png"><span>Buscar</span></div>
        <div class="item"><img src="img/mensajes.png"><span>Mensajes</span></div>
        <div class="item"><img src="img/corazon.png"><span>Notificaciones</span></div>
    </div>


    <!-- FEED -->
    <div class="feed">

        <!-- Historias -->
        <div class="stories">
            <div class="story"><img src="img/ferrari.jpg"><p>Tu historia</p></div>
            <div class="story"><img src="img/ney.png"><p>Neymar</p></div>
            <div class="story"><img src="img/[R].jpeg"><p>Residente</p></div>
            <div class="story"><img src="img/albert.jpg"><p>Albert</p></div>
            <div class="story"><img src="img/tony.webp"><p>tony</p></div>
        </div>

        <!-- Post1 -->
        <div class="post">

            <div class="post-header">
                <img src="img/ney.png" class="avatar">
                <span>neymarjr</span>
            </div>

            <div class="post-image">
                <img src="img/ney puma.jpeg">
            </div>

            <div class="post-actions">
            <div class="action">
                <img src="img/corazon.png"><p>12.5K</p></div>
            <div class="action">
                <img src="img/comentar.png"><p>1.2K</p></div>
                <div class="action">
                <img src="img/mensajes.png"><p>100</p></div>
            </div>

          </div>
          <!-- post2 -->
          <div class="post">

            <div class="post-header">
                <img src="img/[R].jpeg" class="avatar">
                <span>Residente</span>
            </div>

            <div class="post-image">
                <img src="img/resi.jpeg">
            </div>

            <div class="post-actions">
                <div class="action">
                    <img src="img/corazon.png"><p>12K</p>
                </div>
                <div class="action">
                    <img src="img/comentar.png"><p>1mill</p>
                </div>
                <div class="action">
                    <img src="img/mensajes.png"><p>40</p>
                </div>
            </div>

          </div>

            <!-- post3 -->
            <div class="post">

            <div class="post-header">
                <img src="img/albert.jpg" class="avatar">
                <span>Albert</span>
            </div>

            <div class="post-image">
                <img src="img/einstein.png">
            </div>

            <div class="post-actions">
                <div class="action">
                    <img src="img/corazon.png"><p>1.2mill</p>
                </div>
                <div class="action">
                    <img src="img/comentar.png"><p>5.7K</p>
                </div>
                <div class="action">
                    <img src="img/mensajes.png"><p>1.4k</p>
                </div>
            </div>
          </div>

        </div>

    


    <!-- SUGERENCIAS -->
    <div class="suggestions">
        <h3>Sugerencias para ti</h3>

        <div class="suggestion">
            <img src="img/messi.jpg">
            <span>Messi</span>
            <button>Seguir</button>
        </div>

        <div class="suggestion">
            <img src="img/rnaldo.jpeg">
            <span>Ronaldo</span>
            <button>Seguir</button>
        </div>

         <div class="suggestion">
            <img src="img/elon-musk.webp">
            <span>Elon Musk</span>
            <button>Seguir</button>
        </div>

        <div class="suggestion">
            <img src="img/superman.webp">
            <span>Superman</span>
            <button>Seguir</button>
        </div>


      </div>

    </div>

   </div>

</div>

</body>
</html>
